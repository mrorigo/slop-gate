name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify release version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: avrea-ubuntu-latest-2-vcpu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Ancestry cannot be tested against a shallow history.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Match tag to package version
        shell: bash
        run: |
          set -euo pipefail
          package_id="$(cargo pkgid --locked)"
          package_version="${package_id##*#}"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "tag v$tag_version does not match Cargo package version $package_version" >&2
            exit 1
          fi

      - name: Require tag to be reachable from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            missing="$(git rev-list --count FETCH_HEAD.."$GITHUB_SHA" || echo '?')"
            extra="$(git rev-list --count "$GITHUB_SHA"..FETCH_HEAD || echo '?')"
            echo "tag ${GITHUB_REF_NAME} is not reachable from origin/main" >&2
            echo "the tagged commit has $missing commit(s) that main does not contain" >&2
            if [ "$extra" != "0" ]; then
              echo "and main has diverged, with $extra commit(s) the tag does not contain" >&2
            fi
            echo "a release tag that main does not contain leaves main and the published" >&2
            echo "release disagreeing, and every pull request then carries the tagged" >&2
            echo "commit in its diff. Push the tagged commit to main, then retag." >&2
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is reachable from origin/main"

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            ext: ""
            archive: tar.gz
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Zig (musl cross builds)
        if: contains(matrix.target, 'musl')
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild (musl cross builds)
        if: contains(matrix.target, 'musl')
        shell: bash
        run: cargo install cargo-zigbuild --locked

      - name: Build slop-gate
        if: ${{ !contains(matrix.target, 'musl') }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build slop-gate (musl)
        if: contains(matrix.target, 'musl')
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/slop-gate${{ matrix.ext }}"
          OUT="dist/slop-gate-${{ matrix.target }}.tar.gz"
          tar -C "$(dirname "$BIN")" -czf "$OUT" "$(basename "$BIN")"
          shasum -a 256 "$OUT" > "dist/slop-gate-${{ matrix.target }}.tar.gz.sha256"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bin = "target/${{ matrix.target }}/release/slop-gate${{ matrix.ext }}"
          $out = "dist/slop-gate-${{ matrix.target }}.zip"
          Compress-Archive -Path $bin -DestinationPath $out -Force
          $hash = (Get-FileHash -Algorithm SHA256 $out).Hash.ToLower()
          "$hash  slop-gate-${{ matrix.target }}.zip" | Out-File -Encoding ascii "dist/slop-gate-${{ matrix.target }}.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slop-gate-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: avrea-ubuntu-latest-2-vcpu
    needs: [verify-version, build]
    if: always() && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped') && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          expected=(
            "slop-gate-aarch64-apple-darwin.tar.gz"
            "slop-gate-aarch64-apple-darwin.tar.gz.sha256"
            "slop-gate-aarch64-unknown-linux-gnu.tar.gz"
            "slop-gate-aarch64-unknown-linux-gnu.tar.gz.sha256"
            "slop-gate-aarch64-unknown-linux-musl.tar.gz"
            "slop-gate-aarch64-unknown-linux-musl.tar.gz.sha256"
            "slop-gate-x86_64-unknown-linux-musl.tar.gz"
            "slop-gate-x86_64-unknown-linux-musl.tar.gz.sha256"
            "slop-gate-x86_64-pc-windows-msvc.zip"
            "slop-gate-x86_64-pc-windows-msvc.zip.sha256"
            "slop-gate-x86_64-unknown-linux-gnu.tar.gz"
            "slop-gate-x86_64-unknown-linux-gnu.tar.gz.sha256"
          )

          for artifact_dir in dist/*; do
            [ -d "$artifact_dir" ] || continue
            for file in "$artifact_dir"/*; do
              [ -f "$file" ] || continue
              cp "$file" out/
            done
          done

          for name in "${expected[@]}"; do
            if [ ! -f "out/$name" ]; then
              echo "missing expected release artifact: $name" >&2
              exit 1
            fi
          done

          actual_count=$(find out -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [ "$actual_count" -ne 12 ]; then
            echo "expected 12 release files, found $actual_count" >&2
            ls -la out
            exit 1
          fi

          ls -la out

      - name: Create checksums bundle
        shell: bash
        run: |
          set -euo pipefail
          cd out
          cat *.sha256 | sed 's|dist/||g' | tr -d '\r' | sort -u > checksums.sha256
          cat checksums.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*
          generate_release_notes: true
