[package]
name = "slop-gate"
version = "0.4.0"
edition = "2024"
description = "Deterministic repository-aware code quality gates for CI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mrorigo/slop-gate"
homepage = "https://github.com/mrorigo/slop-gate"
documentation = "https://docs.rs/slop-gate"
keywords = ["ci", "code-quality", "duplication", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]
[lib]
name = "slop_gate"
path = "src/lib.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
thiserror = "2.0"
