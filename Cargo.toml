[package]
name = "slop-gate"
version = "0.1.0"
edition = "2024"
description = "Deterministic repository-aware code quality gates for CI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mrorigo/slop-gate"
homepage = "https://github.com/mrorigo/slop-gate"
documentation = "https://docs.rs/slop-gate"
keywords = ["ci", "code-quality", "duplication", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]
[lib]
name = "slop_gate"
path = "src/lib.rs"

[dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
thiserror = "2.0"
